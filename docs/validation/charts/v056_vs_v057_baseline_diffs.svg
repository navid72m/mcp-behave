<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 205" role="img" aria-label="Behavioral baseline diffs comparison between v0.5.6 and v0.5.7 for MotherDuck and Qdrant">

  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f2328; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .subtitle { fill: #59636e; font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #1f2328; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .val { fill: #1f2328; font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .track { fill: #eaeef2; }
    .grid { stroke: #d0d7de; stroke-dasharray: 2,3; }
    .blue { fill: #0969da; }
    .green { fill: #1a7f37; }
    .amber { fill: #9a6700; }
    .muted { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .title { fill: #e6edf3; }
      .subtitle { fill: #8b949e; }
      .label { fill: #e6edf3; }
      .val { fill: #e6edf3; }
      .track { fill: #21262d; }
      .grid { stroke: #30363d; }
      .blue { fill: #58a6ff; }
      .green { fill: #3fb950; }
      .amber { fill: #d29922; }
      .muted { fill: #8b949e; }
    }
  </style>

<rect class="bg" x="1" y="1" width="718" height="203" rx="8"/>
