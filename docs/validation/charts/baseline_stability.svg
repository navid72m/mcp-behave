<rect class="amber" x="225" y="204" width="186.7" height="16" rx="3"/>
<text class="val" x="477" y="217">Unstable (3/3 FAIL, 7 diffs)</text>
<text class="label" x="20" y="249">MCP Memory Service (13.0.0)</text>
<rect class="track" x="225" y="236" width="240" height="16" rx="3"/>
<rect class="amber" x="225" y="236" width="240.0" height="16" rx="3"/>
