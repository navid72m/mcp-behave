<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="Behavioral baseline stability across 3 consecutive check runs on mcp-behave v0.5.7">

  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f2328; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .subtitle { fill: #59636e; font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #1f2328; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .val { fill: #1f2328; font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .track { fill: #eaeef2; }
    .grid { stroke: #d0d7de; stroke-dasharray: 2,3; }
    .blue { fill: #0969da; }
    .green { fill: #1a7f37; }
    .amber { fill: #9a6700; }
    .muted { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .title { fill: #e6edf3; }
      .subtitle { fill: #8b949e; }
      .label { fill: #e6edf3; }
      .val { fill: #e6edf3; }
      .track { fill: #21262d; }
      .grid { stroke: #30363d; }
      .blue { fill: #58a6ff; }
      .green { fill: #3fb950; }
      .amber { fill: #d29922; }
      .muted { fill: #8b949e; }
    }
  </style>

<rect class="bg" x="1" y="1" width="718" height="288" rx="8"/>
<text class="title" x="20" y="30">Behavioral Baseline Stability (3x Consecutive init / check)</text>
<text class="subtitle" x="20" y="48">Baseline diffs per check run on identical fixture state (0 diffs = stable)</text>
<text class="label" x="20" y="89">MotherDuck MCP (1.1.1)</text>
<rect class="track" x="225" y="76" width="240" height="16" rx="3"/>
<rect class="green" x="225" y="76" width="6" height="16" rx="3"/>
<text class="val" x="477" y="89">Stable (3/3 PASS, 0 diffs)</text>
<text class="label" x="20" y="121">Excel MCP Server (2.3.7)</text>
<rect class="track" x="225" y="108" width="240" height="16" rx="3"/>
<rect class="green" x="225" y="108" width="6" height="16" rx="3"/>
<text class="val" x="477" y="121">Stable (3/3 PASS, 0 diffs)</text>
<text class="label" x="20" y="153">DBHub (2.1.0)</text>
<rect class="track" x="225" y="140" width="240" height="16" rx="3"/>
<rect class="green" x="225" y="140" width="6" height="16" rx="3"/>
<text class="val" x="477" y="153">Stable (3/3 PASS, 0 diffs)</text>
<text class="label" x="20" y="185">Desktop Commander (0.3.4)</text>
<rect class="track" x="225" y="172" width="240" height="16" rx="3"/>
<rect class="amber" x="225" y="172" width="106.7" height="16" rx="3"/>
<text class="val" x="477" y="185">Unstable (3/3 FAIL, 4 diffs)</text>
